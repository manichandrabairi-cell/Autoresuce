services:
  - type: web
    name: autorescue
    runtime: python
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build && pip install -r backend/requirements.txt
    startCommand: python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: NODE_VERSION
        value: 20.11.0
      - key: DATABASE_URL
        value: sqlite:///./autorescue.db
      - key: SECRET_KEY
        generateValue: true
      - key: RAZORPAY_TEST_MODE
        value: "true"
